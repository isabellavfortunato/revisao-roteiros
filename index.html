 --azul:#5566A6;--azulTint:#ECEEF6;--terra:#C25A3C;--terraTint:#F7EAE3;--verde:#4E8C6A;--verdeTint:#E9F1EC;
 --gold:#B5852C;--goldTint:#F3EAD6;
 --titulo:'Fraunces',Georgia,serif;--texto:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-thumb{background:rgba(31,29,27,0.18);border-radius:6px;}

/* Login */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
.lcard{width:100%;max-width:380px;background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:26px 24px;box-shadow:0 6px 24px rgba(31,29,27,0.07);}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--azul);font-weight:600;margin-bottom:6px;}
.lcard h1{font-family:var(--titulo);margin:0 0 4px;font-size:24px;font-weight:600;}
.lcard p.sub{margin:0 0 20px;color:var(--suave);font-size:13.5px;line-height:1.5;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--suave);margin-bottom:5px;}
.field input{width:100%;height:44px;padding:0 13px;border:1px solid var(--linha);border-radius:10px;font-size:15px;color:var(--tinta);background:#fff;outline:none;}
.field input:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(85,102,166,0.14);}
.primary{width:100%;height:46px;border:none;border-radius:10px;background:var(--azul);color:#fff;font-size:15px;font-weight:600;margin-top:6px;}
.secondary{width:100%;height:44px;border:1px solid var(--linha);border-radius:10px;background:transparent;color:var(--suave);font-size:14px;font-weight:500;margin-top:10px;}
.msg{margin-top:14px;font-size:13px;line-height:1.45;min-height:18px;}
.msg.err{color:var(--antes);}.msg.ok{color:var(--verde);}

/* App shell */
#app{display:none;}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 72px;}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.appbar h1{font-family:var(--titulo);font-weight:600;font-size:26px;margin:0;}
.userbox{display:flex;align-items:center;gap:8px;}
.useremail{font-size:12px;color:var(--suave);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ghost{background:transparent;color:var(--suave);border:1px solid var(--linha);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:500;}

.tabs{display:flex;gap:6px;background:var(--planejadoTint);border-radius:12px;padding:4px;margin-bottom:18px;}
.tabbtn{flex:1;border:none;background:transparent;border-radius:9px;padding:10px;font-size:14.5px;font-weight:600;color:var(--suave);}
.tabbtn.on{background:var(--cartao);color:var(--tinta);box-shadow:0 1px 3px rgba(31,29,27,0.08);}

/* Cartões de fase */
.cards{display:flex;gap:10px;}
.pcard{flex:1;background:var(--cartao);border:1.5px solid var(--linha);border-radius:16px;padding:12px 12px 14px;text-align:left;}
.pcard .pn{font-size:13px;font-weight:600;margin-bottom:2px;}
.pcard .big{font-family:var(--titulo);font-weight:600;font-size:34px;line-height:1;}
.pcard .plab{font-size:11px;color:var(--suave);margin-top:2px;}
.pbar{height:5px;border-radius:3px;background:var(--linha);margin-top:9px;overflow:hidden;}
.pbar > i{display:block;height:100%;border-radius:3px;}

.pctline{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.pct{font-size:13.5px;color:var(--suave);}
.opbtn{background:transparent;border:1px solid var(--linha);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--suave);}
.opbtn.on{background:var(--tinta);color:#fff;border-color:var(--tinta);}

.panel{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:12px;margin-top:12px;}
.frow{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:var(--planejadoTint);border:none;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--tinta);}
.chip.on{color:#fff;}
.arow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center;}
.act{background:transparent;border:1px solid var(--linha);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--tinta);}
.act.on{background:var(--tinta);color:#fff;border-color:var(--tinta);}
.linkact{background:none;border:none;color:var(--suave);text-decoration:underline;font-size:12.5px;padding:6px 4px;}
.limpconf{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--tinta);}
.limpconf b{font-weight:600;}
.simbtn{background:var(--antes);color:#fff;border:none;border-radius:999px;padding:5px 12px;font-size:12.5px;}
.naobtn{background:transparent;border:1px solid var(--linha);border-radius:999px;padding:5px 12px;font-size:12.5px;}
.status{margin-top:11px;font-size:11.5px;color:var(--suave);}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verde);margin-right:5px;vertical-align:middle;}

.expbox{white-space:pre-wrap;font-size:12.5px;line-height:1.5;background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:12px;max-height:320px;overflow:auto;margin-bottom:10px;}
.copybtns{display:flex;gap:8px;}
.copybtns button{border:1px solid var(--linha);background:var(--cartao);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;}
.histday{margin-top:12px;}
.histday h4{font-family:var(--titulo);font-weight:600;font-size:15px;margin:0 0 6px;}
.histrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--linha);font-size:13px;}
.htag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:2px 7px;border-radius:999px;flex-shrink:0;}
.hid{color:var(--suave);font-variant-numeric:tabular-nums;min-width:34px;}

/* Documentos e itens */
.doc{margin-top:16px;}
.dochead{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;padding:6px 2px;text-align:left;}
.dochead .arrow{transition:transform .15s ease;color:var(--suave);flex-shrink:0;}
.dochead.col .arrow{transform:rotate(-90deg);}
.dochead h2{font-family:var(--titulo);font-weight:600;font-size:18px;margin:0;flex:1;}
.doccount{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums;}
.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:56px;padding:9px 12px;border-radius:12px;margin-top:7px;background:var(--cartao);border:1px solid var(--linha);}
.bolha{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--planejado);}
.iid{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums;min-width:34px;flex-shrink:0;}
.ititle{font-size:14.5px;line-height:1.3;flex:1;}
.etq{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;flex-shrink:0;}

/* Cronômetro */
.cstats{display:flex;gap:10px;}
.cstat{flex:1;background:var(--azulTint);border:1px solid rgba(85,102,166,0.3);border-radius:14px;padding:12px 13px;}
.cstat .cv{font-size:21px;font-weight:700;color:var(--azul);}
.cstat .cl{font-size:11px;color:var(--suave);margin-top:4px;line-height:1.3;}
.cstat .csub{font-size:10px;color:var(--azul);margin-top:4px;font-weight:500;}
.searchwrap{display:flex;align-items:center;gap:9px;margin-top:14px;padding:0 12px;height:42px;background:var(--cartao);border:1px solid var(--linha);border-radius:10px;}
.searchwrap svg{color:var(--suave);flex-shrink:0;}
.searchwrap input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--tinta);min-width:0;}
.searchclear{background:transparent;border:none;color:var(--suave);display:flex;align-items:center;padding:4px;}
.searchcount{margin-top:8px;font-size:12px;color:var(--suave);display:none;}
.activebar{display:none;align-items:center;gap:12px;margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--goldTint);border:1px solid rgba(181,133,44,0.35);}
.activebar .apulse{width:9px;height:9px;border-radius:50%;background:var(--gold);flex-shrink:0;animation:pulse 1.6s ease-in-out infinite;}
.activebar .albl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;}
.activebar .atit{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.activebar .atime{font-size:20px;font-weight:700;color:var(--gold);flex-shrink:0;}
.activebar .apause{background:var(--gold);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
.crow{display:flex;align-items:center;gap:11px;padding:10px 12px 10px 11px;border-radius:12px;margin-top:7px;background:var(--cartao);border:1px solid var(--linha);border-left:3px solid transparent;}
.crow.run{background:var(--goldTint);border-left-color:var(--gold);}
.crow.done{background:var(--azulTint);border-left-color:var(--azul);}
.cnum{width:38px;height:30px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--suave);background:rgba(31,29,27,0.05);border:1px solid var(--linha);font-variant-numeric:tabular-nums;}
.ctitle{font-size:14.5px;line-height:1.3;flex:1;min-width:0;}
.crow.done .ctitle{color:var(--suave);}
.ctime{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:600;min-width:62px;text-align:right;flex-shrink:0;}
.ctime.zero{color:var(--suave);}
.crow.run .ctime{color:var(--gold);}
.cbtns{display:flex;gap:6px;flex-shrink:0;}
.cib{width:36px;height:36px;border-radius:9px;border:none;display:flex;align-items:center;justify-content:center;}
.cplay{background:var(--goldTint);color:var(--gold);}
.crow.run .cplay{background:var(--gold);color:#fff;}
.ccheck{background:var(--azulTint);color:var(--azul);}
.crow.done .ccheck{background:var(--azul);color:#fff;}
.cempty{text-align:center;color:var(--suave);font-size:14px;padding:40px 20px;display:none;}
.foot{margin-top:22px;color:var(--suave);font-size:12px;line-height:1.5;}
</style>
</head>
<body>

<div id="login">
 <div class="lcard">
  <div class="eyebrow">Roteiros</div>
  <h1>Controle e cronômetro</h1>
  <p class="sub">Entre com o seu e-mail e senha para acessar em qualquer aparelho. Na primeira vez, use criar conta.</p>
  <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" placeholder="voce@exemplo.com" /></div>
  <div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" placeholder="mínimo de seis caracteres" /></div>
  <button class="primary" id="btnEntrar">Entrar</button>
  <button class="secondary" id="btnCriar">Criar conta</button>
  <div class="msg" id="loginMsg"></div>
 </div>
</div>

<div id="app"><div class="wrap">
 <div class="appbar">
  <h1>Roteiros</h1>
  <div class="userbox"><span class="useremail" id="userEmail"></span><button class="ghost" id="btnSair">Sair</button></div>
 </div>
 <div class="tabs">
  <button class="tabbtn on" data-act="tab:controle" id="tabBtnControle">Controle</button>
  <button class="tabbtn" data-act="tab:cronometro" id="tabBtnCronometro">Cronômetro</button>
 </div>
 <div id="tabControle"></div>
 <div id="tabCronometro" style="display:none"></div>
</div></div>

 revisao:{nome:"Revisão",cor:"var(--azul)",tint:"var(--azulTint)",corHex:"#5566A6",tintHex:"#ECEEF6",pct:"revisados",planej:"Para revisar",antes:"Revisado antes"},

let estado={revisao:{},gravacao:{},edicao:{},tempos:{}};

const $=id=>document.getElementById(id);
function today(){const d=new Date();const p=v=>String(v).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function fmt(t){const s=Math.max(0,Math.floor(t));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),se=s%60;const p=v=>String(v).padStart(2,"0");return h>0?h+":"+p(m)+":"+p(se):p(m)+":"+p(se);}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function cid(id){return "x"+String(id).replace(/[^A-Za-z0-9]/g,"_");}

function getS(f,id){const o=estado[f][id];return o?o.s:0;}
function setS(f,id,s){if(s===0){delete estado[f][id];}else{estado[f][id]={s:s,d:(s===2?today():null)};}}
function cycle(f,id){setS(f,id,(getS(f,id)+1)%4);}
function curSec(id){if(id===cron.activeId)return cron.base+(Date.now()-cron.start)/1000;return estado.tempos[id]||0;}
function isConcl(id){const s=getS("revisao",id);return s===2||s===3;}
function setConcl(id,v){if(v){estado.revisao[id]={s:2,d:today()};}else{delete estado.revisao[id];}}

function contagem(f){let pl=0,fe=0,an=0;for(const id of ORDER){const s=getS(f,id);if(s===1)pl++;else if(s===2)fe++;else if(s===3)an++;}const pr=fe+an;return{planej:pl,feitos:fe,antes:an,prontos:pr,faltam:TOTAL-pr,total:TOTAL};}

function renderControle(){
 const f=ui.fase, fa=FASES[f];
 let h='<div class="cards">';
 for(const k of FASE_ORDER){
  const c=contagem(k), m=FASES[k];
  const ativo=(k===f);
  const mostrarProntos=(ativo&&ui.mostrarProntos);
  let big, lab;
  if(mostrarProntos){big=String(c.prontos);lab="feitos";}
  else if(c.faltam===0){big="Pronto";lab="tudo feito";}
  else{big=String(c.faltam);lab="faltam";}
  const w=Math.round(c.prontos/c.total*100);
  const style=ativo?('border-color:'+m.corHex+';background:'+m.tintHex):'';

    +'<div class="pn" style="color:'+m.corHex+'">'+m.nome+'</div>'

    +'<div class="pbar"><i style="width:'+w+'%;background:'+m.corHex+'"></i></div></button>';
 }
 h+='</div>';
 const c=contagem(f); const pctv=Math.round(c.prontos/c.total*100);
 h+='<div class="pctline"><span class="pct">'+pctv+'% '+fa.pct+'</span>'
   +'<button class="opbtn'+(ui.opcoes?' on':'')+'" data-act="opcoes">Opções</button></div>';

 if(ui.opcoes){
  h+='<div class="panel">';
  const filtros=[["todos","Todos",null],["faltam","Faltam",c.faltam],["planejados","Planejados",c.planej],["feitos","Feitos",c.feitos+c.antes],["anteriores","Anteriores",c.antes]];
  h+='<div class="frow">';
  for(const [key,label,n] of filtros){
   const on=ui.filtro===key;
   const cor=(key==="anteriores")?'var(--antes)':fa.cor;
   const st=on?('background:'+(key==="anteriores"?"#B92E4B":fa.corHex)+';color:#fff'):'';
   h+='<button class="chip'+(on?' on':'')+'" style="'+st+'" data-act="filtro:'+key+'">'+label+(n!==null?' '+n:'')+'</button>';
  }
  h+='</div><div class="arow">';
  h+='<button class="act'+(ui.painel==="exportar"?' on':'')+'" data-act="painel:exportar">Exportar</button>';

  }

  h+='<div class="status"><span class="dot" style="background:'+(syncOk?"var(--verde)":"var(--planejado)")+'"></span>'+(syncOk?"Sincronizado na nuvem":"Salvando")+'</div>';
  h+='</div>';
 }
 if(ui.painel==="exportar") h+=painelExportar();
 else if(ui.painel==="historico") h+=painelHistorico();

 // lista por documentos
 DOCS.forEach((dc,idx)=>{
  const itens=dc.it.filter(x=>filtroPass(f,x.id));
  let prontosDoc=0; dc.it.forEach(x=>{const s=getS(f,x.id);if(s===2||s===3)prontosDoc++;});
  const key=f+":"+idx; const col=ui.recolhidos.has(key);
  h+='<div class="doc"><button class="dochead'+(col?' col':'')+'" data-act="doc:'+f+':'+idx+'">'+SVG_ARROW
    +'<h2>'+esc(dc.n)+'</h2><span class="doccount">'+prontosDoc+'/'+dc.it.length+'</span></button>';
  if(!col){
   if(itens.length===0){h+='<div class="foot" style="margin-top:6px">Nada neste filtro.</div>';}
   for(const x of itens) h+=itemHTML(f,fa,x);
  }
  h+='</div>';
 });

function filtroPass(f,id){const s=getS(f,id);switch(ui.filtro){case"faltam":return s===0||s===1;case"planejados":return s===1;case"feitos":return s===2||s===3;case"anteriores":return s===3;default:return true;}}
function itemHTML(f,fa,x){
 const s=getS(f,x.id);
 let bg="var(--cartao)",bd="var(--linha)",bolha="",etq="",tcolor=(s===0?"var(--tinta)":"var(--suave)");
 if(s===1){bg="var(--planejadoTint)";bd="var(--planejado)";bolha='<span class="bolha" style="border-color:var(--planejado)"><span style="width:8px;height:8px;border-radius:50%;background:var(--planejado)"></span></span>';etq='<span class="etq" style="background:var(--planejadoTint);color:var(--suave)">'+fa.planej+'</span>';}
 else if(s===2){bg=fa.tintHex;bd=fa.corHex;bolha='<span class="bolha" style="border-color:'+fa.corHex+';background:'+fa.corHex+'">'+SVG_CHECK_S+'</span>';}
 else if(s===3){bg="var(--antesTint)";bd="var(--antes)";bolha='<span class="bolha" style="border-color:var(--antes);background:var(--antes)">'+SVG_CHECK_S+'</span>';etq='<span class="etq" style="background:var(--antesTint);color:var(--antes)">'+fa.antes+'</span>';}
 else {bolha='<span class="bolha"></span>';}
 return '<button class="item" style="background:'+bg+';border-color:'+bd+'" data-act="item:'+f+':'+x.id+'">'
  +bolha+'<span class="iid">'+esc(x.id)+'</span><span class="ititle" style="color:'+tcolor+'">'+esc(x.t)+'</span>'+etq+'</button>';
}
function painelExportar(){
 let txt="";
 for(const f of FASE_ORDER){
  const fa=FASES[f];
  const ag=ORDER.filter(id=>getS(f,id)===2), an=ORDER.filter(id=>getS(f,id)===3), pl=ORDER.filter(id=>getS(f,id)===1);
  txt+=fa.nome+"\n";
  txt+="Feitos agora ("+ag.length+")\n"+ag.map(id=>"  "+id+". "+byId[id]).join("\n")+(ag.length?"\n":"");
  txt+="Feitos antes ("+an.length+")\n"+an.map(id=>"  "+id+". "+byId[id]).join("\n")+(an.length?"\n":"");
  txt+="Planejados ("+pl.length+")\n"+pl.map(id=>"  "+id+". "+byId[id]).join("\n")+(pl.length?"\n":"");
  txt+="\n";
 }
 return '<div class="panel"><div class="expbox" id="expbox">'+esc(txt.trim())+'</div><div class="copybtns"><button data-act="exp-copiar">Copiar</button><button data-act="exp-baixar">Baixar</button></div></div>';
}
function labelDia(dStr){
 const p=dStr.split("-").map(Number); const d=new Date(p[0],p[1]-1,p[2]);
 const hoje=new Date(); hoje.setHours(0,0,0,0);
 const diff=Math.round((hoje-d)/86400000);
 if(diff===0)return"Hoje";if(diff===1)return"Ontem";if(diff===2)return"Anteontem";
 const pp=v=>String(v).padStart(2,"0"); return pp(p[2])+"/"+pp(p[1])+"/"+p[0];
}
function painelHistorico(){
 const ents=[];
 for(const f of FASE_ORDER)for(const id of ORDER){const o=estado[f][id];if(o&&o.s===2&&o.d)ents.push({d:o.d,f:f,id:id});}
 if(ents.length===0)return '<div class="panel"><div class="foot" style="margin-top:0">Nada marcado como feito agora ainda.</div></div>';
 const grupos={}; ents.forEach(e=>{(grupos[e.d]=grupos[e.d]||[]).push(e);});
 const dias=Object.keys(grupos).sort().reverse();
 let h='<div class="panel">';
 for(const dia of dias){
  h+='<div class="histday"><h4>'+labelDia(dia)+'</h4>';
  for(const e of grupos[dia]){const fa=FASES[e.f];
   h+='<div class="histrow"><span class="htag" style="background:'+fa.tintHex+';color:'+fa.corHex+'">'+fa.nome+'</span><span class="hid">'+esc(e.id)+'</span><span>'+esc(byId[e.id])+'</span></div>';}
  h+='</div>';
 }
 h+='</div>'; return h;
}

/* ---------- CRONOMETRO ---------- */
function buildCronometro(){
 const cont=contagem("revisao");
 let concl=0,total=0,cron_n=0,cronT=0;
 for(const id of ORDER){const t=curSec(id);total+=t;if(t>0){cron_n++;cronT+=t;}if(isConcl(id))concl++;}
 const media=cron_n>0?fmt(cronT/cron_n):"--:--";
 const sub=cron_n>0?("com base em "+cron_n+" "+(cron_n===1?"roteiro cronometrado":"roteiros cronometrados")):"nenhum roteiro cronometrado ainda";
 let h='<div class="cstats">'
  +'<div class="cstat"><div class="cv" id="cConcl">'+concl+' de '+TOTAL+'</div><div class="cl">Roteiros revisados</div></div>'
  +'<div class="cstat"><div class="cv mono" id="cTotal">'+fmt(total)+'</div><div class="cl">Tempo total registrado</div></div>'
  +'<div class="cstat"><div class="cv mono" id="cMedia">'+media+'</div><div class="cl">Tempo médio por roteiro cronometrado</div><div class="csub" id="cSub">'+sub+'</div></div>'
  +'</div>';
 h+='<div class="searchwrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
  +'<input id="csearch" placeholder="Buscar roteiro pelo número ou por uma palavra do título" />'
  +'<button class="searchclear" id="cclear" style="display:none" data-act="cbusca-limpar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
 h+='<div class="searchcount" id="ccount"></div>';
 h+='<div class="activebar" id="cactive"><span class="apulse"></span><div style="min-width:0;flex:1"><div class="albl">Revisando agora</div><div class="atit" id="catit"></div></div><div class="atime mono" id="catime">00:00</div><button class="apause" data-act="cpause">Pausar</button></div>';
 for(const id of ORDER){
  const running=cron.activeId===id, done=isConcl(id), s=curSec(id);
  h+='<div class="crow'+(running?" run":"")+(done?" done":"")+'" id="'+cid(id)+'">'
   +'<div class="cnum">'+esc(id)+'</div>'
   +'<div class="ctitle">'+esc(byId[id])+'</div>'
   +'<div class="ctime'+(s<=0&&!running?" zero":"")+'" id="t-'+cid(id)+'">'+fmt(s)+'</div>'
   +'<div class="cbtns">'
   +'<button class="cib cplay" data-act="cplay:'+id+'">'+(running?SVG_PAUSE:SVG_PLAY)+'</button>'
   +'<button class="cib ccheck" data-act="cconcl:'+id+'">'+SVG_CHECK+'</button>'
   +'</div></div>';
 }
 h+='<div class="cempty" id="cempty">Nenhum roteiro encontrado para essa busca.</div>';
 h+='<div class="foot">As suas marcações e tempos ficam salvos na nuvem e aparecem em todos os aparelhos.</div>';
 $("tabCronometro").innerHTML=h;
 const si=$("csearch"); si.value=ui.query; si.addEventListener("input",()=>{ui.query=si.value;applyCronFilter();});
 applyCronFilter(); updateCronActive();
}
function applyCronFilter(){
 const q=norm(ui.query.trim()); let shown=0;
 for(const id of ORDER){const el=$(cid(id));if(!el)continue;const match=!q||norm(byId[id]).includes(q)||String(id).toLowerCase().includes(q);el.style.display=match?"flex":"none";if(match)shown++;}
 const cc=$("cclear"); if(cc)cc.style.display=q?"flex":"none";
 const cnt=$("ccount"); if(cnt){if(q){cnt.style.display="block";cnt.textContent="Mostrando "+shown+" de "+TOTAL+" roteiros";}else cnt.style.display="none";}
 const emp=$("cempty"); if(emp)emp.style.display=shown===0?"block":"none";
}
function updateCronRow(id){
 const el=$(cid(id)); if(!el)return;
 const running=cron.activeId===id, done=isConcl(id);
 el.classList.toggle("run",running); el.classList.toggle("done",done);
 const pb=el.querySelector(".cplay"); if(pb)pb.innerHTML=running?SVG_PAUSE:SVG_PLAY;
 updateCronTime(id);
}
function updateCronTime(id){const tc=$("t-"+cid(id));if(!tc)return;const s=curSec(id);tc.textContent=fmt(s);tc.classList.toggle("zero",s<=0&&cron.activeId!==id);}
function updateCronStats(){
 let concl=0,total=0,n=0,tt=0;
 for(const id of ORDER){const t=curSec(id);total+=t;if(t>0){n++;tt+=t;}if(isConcl(id))concl++;}
 if($("cConcl"))$("cConcl").textContent=concl+" de "+TOTAL;
 if($("cTotal"))$("cTotal").textContent=fmt(total);
 if($("cMedia"))$("cMedia").textContent=n>0?fmt(tt/n):"--:--";
 if($("cSub"))$("cSub").textContent=n>0?("com base em "+n+" "+(n===1?"roteiro cronometrado":"roteiros cronometrados")):"nenhum roteiro cronometrado ainda";
}
function updateCronActive(){
 const bar=$("cactive"); if(!bar)return; const id=cron.activeId;
 if(id==null){bar.style.display="none";return;}
 bar.style.display="flex"; $("catit").textContent=id+". "+byId[id]; $("catime").textContent=fmt(curSec(id));
}
function setActiveCron(id){
 if(cron.activeId!=null){const p=cron.activeId;estado.tempos[p]=curSec(p);cron.activeId=null;updateCronRow(p);}
 if(id!=null){cron.base=estado.tempos[id]||0;cron.start=Date.now();cron.activeId=id;updateCronRow(id);}
 ensureTick(); updateCronActive(); updateCronStats(); saveSoon(true);
}
function togglePlay(id){cron.activeId===id?setActiveCron(null):setActiveCron(id);}
function toggleConcl(id){
 if(cron.activeId===id){estado.tempos[id]=curSec(id);cron.activeId=null;ensureTick();updateCronActive();}
 setConcl(id,!isConcl(id));
 updateCronRow(id); updateCronStats(); saveNow();
}

/* ---------- TICK e SAVE ---------- */
function tick(){const id=cron.activeId;if(id==null)return;estado.tempos[id]=curSec(id);cron.base=estado.tempos[id];cron.start=Date.now();updateCronTime(id);if(ui.tab==="cronometro"){updateCronStats();if($("catime"))$("catime").textContent=fmt(estado.tempos[id]);}}
function ensureTick(){
 if(cron.activeId!=null&&!tickInt){tickInt=setInterval(tick,1000);periodicSave=setInterval(saveNow,10000);}
 else if(cron.activeId==null&&tickInt){clearInterval(tickInt);tickInt=null;clearInterval(periodicSave);periodicSave=null;}
}
function sanitizeTempos(t){const o={};for(const k in t){const v=Math.round(t[k]);if(v>0)o[k]=v;}return o;}
function saveSoon(force){if(saveTo)clearTimeout(saveTo);saveTo=setTimeout(saveNow,force?300:1400);}
async function saveNow(){
 if(!docRef)return;
 if(cron.activeId!=null)estado.tempos[cron.activeId]=curSec(cron.activeId);
 try{await setDoc(docRef,{revisao:estado.revisao,gravacao:estado.gravacao,edicao:estado.edicao,tempos:sanitizeTempos(estado.tempos),updatedAt:serverTimestamp()});syncOk=true;}
 catch(e){syncOk=false;console.warn(e);}
 if(ui.tab==="controle"&&ui.opcoes)renderControle();
}
function applyRemote(data){
 const activeId=cron.activeId; const activeVal=activeId!=null?curSec(activeId):null;
 estado.revisao=data.revisao||{};estado.gravacao=data.gravacao||{};estado.edicao=data.edicao||{};estado.tempos=Object.assign({},data.tempos||{});
 if(activeId!=null){estado.tempos[activeId]=Math.max(activeVal,(data.tempos||{})[activeId]||0);cron.base=estado.tempos[activeId];cron.start=Date.now();}
 if(ui.tab==="controle"){renderControle();}
 else if($("cConcl")){for(const id of ORDER)updateCronRow(id);updateCronStats();updateCronActive();applyCronFilter();}
 else{buildCronometro();}
}

/* ---------- TABS e EVENTOS ---------- */
function switchTab(t){
 ui.tab=t;
 $("tabBtnControle").classList.toggle("on",t==="controle");
 $("tabBtnCronometro").classList.toggle("on",t==="cronometro");
 $("tabControle").style.display=t==="controle"?"block":"none";
 $("tabCronometro").style.display=t==="cronometro"?"block":"none";
 if(t==="controle")renderControle();else buildCronometro();
}
document.body.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]"); if(!b)return;
 const a=b.dataset.act; const [k,...rest]=a.split(":"); const arg=rest.join(":");
 if(k==="tab"){switchTab(arg);return;}
 if(k==="sair"){signOut(auth);return;}
 // controle
 if(k==="card"){if(ui.fase===arg){ui.mostrarProntos=!ui.mostrarProntos;}else{ui.fase=arg;ui.mostrarProntos=false;ui.filtro="todos";}renderControle();return;}
 if(k==="opcoes"){ui.opcoes=!ui.opcoes;if(!ui.opcoes){ui.painel="none";ui.limpConf=false;}renderControle();return;}
 if(k==="filtro"){ui.filtro=arg;renderControle();return;}
 if(k==="painel"){ui.painel=(ui.painel===arg?"none":arg);renderControle();return;}
 if(k==="limpar"){ui.limpConf=true;renderControle();return;}
 if(k==="limpar-nao"){ui.limpConf=false;renderControle();return;}
 if(k==="limpar-sim"){estado.revisao={};estado.gravacao={};estado.edicao={};ui.limpConf=false;saveNow();renderControle();return;}
 if(k==="doc"){const key=arg;if(ui.recolhidos.has(key))ui.recolhidos.delete(key);else ui.recolhidos.add(key);renderControle();return;}
 if(k==="item"){const [f,id]=[arg.split(":")[0],arg.split(":").slice(1).join(":")];cycle(f,id);saveNow();renderControle();return;}
 if(k==="exp-copiar"){const t=$("expbox").textContent;navigator.clipboard&&navigator.clipboard.writeText(t);b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar",1500);return;}
 if(k==="exp-baixar"){const t=$("expbox").textContent;const bl=new Blob([t],{type:"text/plain"});const u=URL.createObjectURL(bl);const link=document.createElement("a");link.href=u;link.download="Controle de roteiros exportado.txt";link.click();URL.revokeObjectURL(u);return;}
 // cronometro
 if(k==="cplay"){togglePlay(arg);return;}
 if(k==="cconcl"){toggleConcl(arg);return;}
 if(k==="cpause"){if(cron.activeId!=null)setActiveCron(null);return;}
 if(k==="cbusca-limpar"){ui.query="";const si=$("csearch");if(si)si.value="";applyCronFilter();return;}
});

/* ---------- LOGIN ---------- */
const loginMsg=$("loginMsg");
function showMsg(t,tp){loginMsg.textContent=t;loginMsg.className="msg "+(tp||"");}
function fbErr(code){const m={"auth/invalid-email":"E-mail inválido.","auth/missing-password":"Digite a sua senha.","auth/weak-password":"A senha precisa ter ao menos seis caracteres.","auth/email-already-in-use":"Já existe uma conta com esse e-mail. Use entrar.","auth/invalid-credential":"E-mail ou senha incorretos.","auth/too-many-requests":"Muitas tentativas. Aguarde um instante.","auth/network-request-failed":"Sem conexão com a internet."};return m[code]||"Não consegui completar. Tente novamente.";}
$("btnEntrar").addEventListener("click",async()=>{showMsg("Entrando...","");try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("senha").value);}catch(e){showMsg(fbErr(e.code),"err");}});
$("btnCriar").addEventListener("click",async()=>{showMsg("Criando a sua conta...","");try{await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("senha").value);showMsg("Conta criada. Entrando...","ok");}catch(e){showMsg(fbErr(e.code),"err");}});
$("btnSair").addEventListener("click",()=>signOut(auth));
$("senha").addEventListener("keydown",e=>{if(e.key==="Enter")$("btnEntrar").click();});

setPersistence(auth,browserLocalPersistence).catch(()=>{}).finally(()=>{
 onAuthStateChanged(auth,user=>{
  if(user){
   $("login").style.display="none";$("app").style.display="block";$("userEmail").textContent=user.email||"";
   docRef=doc(db,"roteiros",user.uid);
   if(unsub)unsub();
   unsub=onSnapshot(docRef,snap=>{if(snap.metadata.hasPendingWrites)return;applyRemote(snap.data()||{});},err=>{syncOk=false;});
   switchTab("controle");
  }else{
   if(unsub){unsub();unsub=null;}docRef=null;setActiveCron(null);
   estado={revisao:{},gravacao:{},edicao:{},tempos:{}};
   $("app").style.display="none";$("login").style.display="flex";showMsg("","");
  }
 });
});
window.addEventListener("beforeunload",()=>{if(docRef)saveNow();});
</script>
</body>
</html>
